name: Bug report
description: Something in Cairn behaved wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Redact anything private before posting: project names, paths, and file names from the repo you ran Cairn on. Describe the shape ("a nested package directory") instead.
  - type: input
    id: version
    attributes:
      label: Cairn version
      description: Output of `cairn --version`, or the plugin version your host shows.
      placeholder: "0.33.0"
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - Claude Code
        - Cursor
        - Codex CLI
        - Codex Desktop
        - CLI only
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and Node version
      placeholder: "macOS 15, Node 22.14"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. cairn init --no-prompt in a fresh repo
        2. ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Output of `cairn doctor` and `cairn trace --errors-only`, if you can run them in the affected repo.
      render: text
